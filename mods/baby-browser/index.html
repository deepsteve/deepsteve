<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Baby Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { display: flex; flex-direction: column; }

  .url-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
    background: #16213e;
    border-bottom: 1px solid #2a2a4a;
    flex-shrink: 0;
  }
  .url-bar input {
    flex: 1;
    background: #0f0f23;
    border: 1px solid #2a2a4a;
    border-radius: 4px;
    padding: 5px 8px;
    color: #e0e0e0;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 13px;
    outline: none;
  }
  .url-bar input:focus { border-color: #4a4a8a; }
  .nav-btn {
    background: #2a2a4a;
    border: 1px solid #3a3a5a;
    border-radius: 4px;
    color: #e0e0e0;
    padding: 4px 8px;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    min-width: 28px;
    text-align: center;
  }
  .nav-btn:hover { background: #3a3a5a; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover { background: #2a2a4a; }
  .go-btn {
    background: #2a2a4a;
    border: 1px solid #3a3a5a;
    border-radius: 4px;
    color: #e0e0e0;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .go-btn:hover { background: #3a3a5a; }

  iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: #fff;
  }
</style>
</head>
<body>
  <div class="url-bar">
    <button class="nav-btn" id="back" title="Back" disabled>&#9664;</button>
    <button class="nav-btn" id="forward" title="Forward" disabled>&#9654;</button>
    <button class="nav-btn" id="refresh" title="Refresh">&#8635;</button>
    <input type="text" id="url" value="https://example.com" spellcheck="false" autocomplete="off">
    <button class="go-btn" id="go">Go</button>
  </div>
  <!-- No allow-same-origin: the page is from the internet, served from our origin by /api/proxy,
       which also sandboxes it with a CSP. We learn about it only through proxy.js's bridge (#731). -->
  <iframe id="browser" sandbox="allow-scripts allow-forms allow-popups"></iframe>

  <script src="nav-trust.js"></script>
  <script>
    let _d=0;try{let w=window;while(w!==w.parent){w=w.parent;_d++}}catch{}
    const STORAGE_KEY = (_d > 0 ? 'ds'+_d+'-' : '') + 'baby-browser-state';
    const urlInput = document.getElementById('url');
    const goBtn = document.getElementById('go');
    const backBtn = document.getElementById('back');
    const forwardBtn = document.getElementById('forward');
    const refreshBtn = document.getElementById('refresh');
    const frame = document.getElementById('browser');

    // Each history entry records who chose it: { url, by: 'user' | 'page' } (nav-trust.js).
    // Only a 'user' entry is fetched with &by=user, which lets /api/proxy reach local addresses
    // (#746). Back, forward and refresh replay an entry as it was chosen; they never upgrade it.
    function withScheme(url) {
      url = String(url ?? '').trim();
      return !url || /^https?:\/\//i.test(url) ? url : 'https://' + url;
    }

    let navHistory = [{ url: 'https://example.com', by: 'user' }];
    let historyIndex = 0;
    try {
      const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY));
      // Entries saved before #746 are bare strings with no record of who chose them, so 'page'.
      const restored = (saved?.history || [])
        .map((e) => (typeof e === 'string' ? { url: withScheme(e), by: 'page' }
          : { url: withScheme(e?.url), by: e?.by === 'user' ? 'user' : 'page' }))
        .filter((e) => e.url);
      if (restored.length) {
        navHistory = restored;
        historyIndex = Math.max(0, Math.min(saved.index ?? 0, restored.length - 1));
      }
    } catch {}

    // Support ?url= query param for window config restore: a URL the user had open.
    try {
      const paramUrl = new URLSearchParams(window.location.search).get('url');
      if (withScheme(paramUrl)) {
        navHistory = [{ url: withScheme(paramUrl), by: 'user' }];
        historyIndex = 0;
      }
    } catch {}

    function proxyUrl(entry) {
      return '/api/proxy?url=' + encodeURIComponent(entry.url) + (entry.by === 'user' ? '&by=user' : '');
    }

    function saveState() {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ history: navHistory, index: historyIndex }));
    }

    function updateNavButtons() {
      backBtn.disabled = historyIndex <= 0;
      forwardBtn.disabled = historyIndex >= navHistory.length - 1;
    }

    // Loads the current history entry into the frame.
    function replay() {
      const entry = navHistory[historyIndex];
      urlInput.value = entry.url;
      frame.src = proxyUrl(entry);
      updateNavButtons();
      saveState();
      registerWithServer();
    }

    // Pushes a new entry, chosen by `by`, and loads it.
    function openUrl(url, by) {
      url = withScheme(url);
      if (!url) return;
      navHistory.length = historyIndex + 1;
      navHistory.push({ url, by });
      historyIndex = navHistory.length - 1;
      replay();
    }

    // The address bar and Go: typed, so the user chose it.
    function navigate() {
      openUrl(urlInput.value, 'user');
    }

    backBtn.addEventListener('click', () => {
      if (historyIndex <= 0) return;
      historyIndex--;
      replay();
    });

    forwardBtn.addEventListener('click', () => {
      if (historyIndex >= navHistory.length - 1) return;
      historyIndex++;
      replay();
    });

    refreshBtn.addEventListener('click', () => {
      replay();
    });

    // The framed page is opaque-origin, so its DOM and location are out of reach. proxy.js
    // injects a bridge that posts to us instead: a link click or GET form submit arrives as
    // `navigate`, and `read` is answered as `read-result`. Only the window in our own frame is
    // listened to; what it says can only be about the page itself, which it controls anyway.
    //
    // Except the URL in a `navigate`: the page writes that message itself, so it can name any URL,
    // in a loop, and each one is a fetch by the daemon (#746). So a `navigate` is 'page'-chosen
    // (public addresses only, nav-trust.js), and a token bucket caps how many get through: a
    // burst of a few for quick clicks, then one a second. The excess is dropped.
    const PROXY_TAG = 'deepsteve-proxy';
    const READ_TIMEOUT_MS = 5000;
    const PAGE_NAV_BURST = 3;
    const PAGE_NAV_PER_SEC = 1;
    const pendingReads = new Map(); // id -> resolve
    let readSeq = 0;
    let pageNavTokens = PAGE_NAV_BURST;
    let pageNavRefilledAt = performance.now();

    function takePageNavToken() {
      const now = performance.now();
      pageNavTokens = Math.min(PAGE_NAV_BURST, pageNavTokens + ((now - pageNavRefilledAt) / 1000) * PAGE_NAV_PER_SEC);
      pageNavRefilledAt = now;
      if (pageNavTokens < 1) return false;
      pageNavTokens -= 1;
      return true;
    }

    window.addEventListener('message', (e) => {
      if (e.source !== frame.contentWindow) return;
      const m = e.data;
      if (!m || m.tag !== PROXY_TAG) return;
      if (m.kind === 'navigate' && typeof m.url === 'string' && /^https?:\/\//i.test(m.url)) {
        if (!takePageNavToken()) {
          console.warn('Baby Browser: dropped a navigate from the page (rate limit)', m.url);
          return;
        }
        openUrl(m.url, BabyBrowserNavTrust.pageNavigationBy(navHistory[historyIndex], m.url));
      } else if (m.kind === 'read-result' && pendingReads.has(m.id)) {
        pendingReads.get(m.id)(m);
        pendingReads.delete(m.id);
      }
    });

    function readPage() {
      return new Promise((resolve) => {
        const id = ++readSeq;
        const timer = setTimeout(() => { pendingReads.delete(id); resolve(null); }, READ_TIMEOUT_MS);
        pendingReads.set(id, (m) => { clearTimeout(timer); resolve(m); });
        frame.contentWindow.postMessage({ tag: PROXY_TAG, kind: 'read', id }, '*');
      });
    }

    goBtn.addEventListener('click', () => navigate());
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') navigate();
    });

    // ─── Baby Browser MCP bridge ───────────────────────────────────────
    // Declared before the first navigate(), which calls registerWithServer(): reading a `let`
    // ahead of its declaration throws, and that killed the script before initBridge() ever ran.
    let tabInstanceId = null;

    // Load current page from history
    replay();

    function registerWithServer() {
      if (!tabInstanceId) return;
      fetch('/api/baby-browser/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tabId: tabInstanceId, url: navHistory[historyIndex]?.url || '' }),
      }).catch(e => console.warn('Baby Browser register failed:', e));
    }

    function initBridge() {
      if (!window.deepsteve) {
        setTimeout(initBridge, 200);
        return;
      }

      tabInstanceId = window.deepsteve.getTabInstanceId();

      // Re-register on WebSocket reconnect (e.g. after daemon restart) — the
      // server's activeTabs Map is in-memory only, so without this the tab is
      // "lost" until the page reloads. See deepsteve/deepsteve#474.
      if (window.deepsteve.onWSReconnected) {
        window.deepsteve.onWSReconnected(() => registerWithServer());
      }

      window.deepsteve.onBabyBrowserRequest(async (req) => {
        const { requestId, action } = req;
        let result, error;

        try {
          if (action === 'navigate') {
            result = await new Promise((resolve, reject) => {
              const timeout = setTimeout(() => {
                frame.removeEventListener('load', onLoad);
                resolve(`Navigated to ${req.url} (load event timed out after 10s, page may still be loading)`);
              }, 10000);
              function onLoad() {
                clearTimeout(timeout);
                frame.removeEventListener('load', onLoad);
                resolve(`Navigated to ${req.url}`);
              }
              frame.addEventListener('load', onLoad);
              // An agent's baby_browser_navigate is chosen like a typed URL.
              openUrl(req.url, 'user');
            });
          } else if (action === 'read') {
            const page = await readPage();
            if (!page) {
              error = 'The page did not answer: it is not an HTML page, or it has navigated outside the proxy';
            } else {
              const title = typeof page.title === 'string' ? page.title : '';
              const bodyText = typeof page.text === 'string' ? page.text : '';
              result = (title ? `# ${title}\n\n` : '') + bodyText;
            }
          } else if (action === 'url') {
            result = navHistory[historyIndex]?.url || '';
          } else {
            error = `Unknown action: ${action}`;
          }
        } catch (e) {
          error = e.message;
        }

        fetch('/api/baby-browser/result', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requestId, result, error }),
        }).catch(e => console.error('Failed to post baby-browser result:', e));
      });

      // Register this instance with the server
      registerWithServer();
    }

    window.addEventListener('beforeunload', () => {
      if (tabInstanceId) {
        navigator.sendBeacon('/api/baby-browser/deregister',
          new Blob([JSON.stringify({ tabId: tabInstanceId })], { type: 'application/json' }));
      }
    });

    initBridge();
  </script>
</body>
</html>
