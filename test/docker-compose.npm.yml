# Runs the test suite against an install produced by `npm install -g <packed tarball>`
# (test/Dockerfile.npm packs this tree and runs `deepsteve start`), so it catches packaging bugs
# — a module missing from the `files` allowlist, a CLI that deploys the wrong tree — before a
# version is published. npm versions are immutable, so "fix it in the next publish" is the only
# correction available.
#
# Everything but the image under test comes from docker-compose.base.yml — read that file for
# why there is no host port, how the auth token is seeded, and what /scratch is for.
#
# Explicit project name (#616/#588): compose otherwise derives it from this file's parent
# directory — "test" — which is the SAME project as its siblings, whose services are also named
# server/test. A `down -v` would then reach into a concurrently running sibling suite and delete
# its volumes.
name: deepsteve-npm

services:
  server:
    extends:
      file: docker-compose.base.yml
      service: server
    build:
      dockerfile: test/Dockerfile.npm

  test:
    extends:
      file: docker-compose.base.yml
      service: test
    # `extends` never copies depends_on, so this cannot live in the base.
    depends_on:
      server:
        condition: service_healthy

# Nor does it copy top-level keys, so the volumes the base mounts are declared here.
volumes:
  ds_token:
  ds_scratch:
