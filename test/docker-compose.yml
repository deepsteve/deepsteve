# Runs the test suite against the REPO SOURCE (test/Dockerfile copies the working tree into /app).
#
# Explicit project name (#616, same reasoning as #588's on docker-compose.public.yml): compose
# otherwise derives it from this file's parent directory — "test" — which is the SAME project as
# docker-compose.install.yml and docker-compose.public.yml, whose services are also named
# server/test. A `down -v` would then reach into a concurrently running sibling suite and delete
# its volumes.
name: deepsteve-source

services:
  server:
    build:
      context: ..
      dockerfile: test/Dockerfile
    # No host port publish (#616): the test container reaches us as server:3000 on the compose
    # network and the healthcheck runs in-container, so nothing needs one — and 3000:3000
    # collides with the developer's own daemon, which made this suite unrunnable locally.
    environment:
      - PORT=3000
      - DEEPSTEVE_BIND=0.0.0.0
      # Auth (#536): the test container reaches us as http://server:3000, so allowlist that host.
      - DEEPSTEVE_ALLOW_HOST=server
      # Test mode (#562): marks this disposable instance so /api/version reports testMode:true —
      # the test helpers refuse destructive calls (and the server refuses killall) without it.
      - DEEPSTEVE_TEST_MODE=1
    volumes:
      # Share the auto-generated ~/.deepsteve/auth-token so the test container authenticates with the
      # REAL token (no override). The app lives in /app here, so /root/.deepsteve is data-only.
      - ds_home:/root/.deepsteve
      # Scratch cwds the test container creates and this one must be able to spawn into (#637).
      # These are two containers: before this mount, a test's os.tmpdir() path existed only in
      # `test`, and since #632 the server REFUSES a spawn into a cwd it cannot see. Deliberately
      # not ds_home — that is daemon state, not a place for tests to make directories.
      - ds_scratch:/scratch
    healthcheck:
      # /healthz is the public, unauthenticated readiness endpoint; /api/version is now auth-gated.
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  test:
    build:
      context: ..
      dockerfile: test/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      - DEEPSTEVE_URL=http://server:3000
      # Where test/helpers/server-dir.js makes scratch cwds, so they exist for the server too
      # (#637). Unset, that helper falls back to os.tmpdir() — correct only when the daemon is
      # this machine, which here it is not.
      - DEEPSTEVE_TEST_SCRATCH=/scratch
    volumes:
      - ds_home:/root/.deepsteve   # read the server's real auth token (#536)
      - ds_scratch:/scratch        # same mount as the server, see above (#637)
    # Run files serially (one process each); tmux IS installed here, so run all.
    # See test/run-integration.sh for why --test-concurrency=1 isn't enough.
    command: ["sh", "test/run-integration.sh"]

volumes:
  ds_home:
  ds_scratch:
