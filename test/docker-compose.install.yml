# Runs the test suite against a LOCALLY-GENERATED install.sh (test/Dockerfile.install runs
# `release.sh`'s output, so this catches install-script bugs before the script is published).
#
# Everything but the image under test comes from docker-compose.base.yml — read that file for
# why there is no host port, how the auth token is seeded, and what /scratch is for.
#
# Explicit project name (#616, same reasoning as #588's on docker-compose.public.yml): compose
# otherwise derives it from this file's parent directory — "test" — which is the SAME project as
# its siblings, whose services are also named server/test. A `down -v` would then reach into a
# concurrently running sibling suite and delete its volumes.
name: deepsteve-install

services:
  server:
    extends:
      file: docker-compose.base.yml
      service: server
    build:
      dockerfile: test/Dockerfile.install

  test:
    extends:
      file: docker-compose.base.yml
      service: test
    # `extends` never copies depends_on, so this cannot live in the base.
    depends_on:
      server:
        condition: service_healthy

# Nor does it copy top-level keys, so the volumes the base mounts are declared here.
volumes:
  ds_token:
  ds_scratch:
