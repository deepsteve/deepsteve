# The half that every INSTALLED-SERVER suite shares. Not runnable on its own.
#
# docker-compose.install.yml (a locally generated install.sh), docker-compose.npm.yml (a packed
# tarball) and docker-compose.public.yml (the published install.sh at deepsteve.com) differed
# only in which Dockerfile builds `server`. Everything else was three byte-identical copies of
# the sixty lines below.
#
# That is not a tidiness complaint. #637 taught test/helpers/server-dir.js to demand a scratch
# directory BOTH containers can see, added the mount to docker-compose.yml — and missed all
# three copies here, because there was nothing structural to miss it in. The daily public suite
# went red the next time a release shipped, and the other two would have thrown
# `DEEPSTEVE_TEST_SCRATCH is unset` the moment anyone ran them. So the shared half lives here
# once, and each suite carries only the image under test.
#
# docker-compose.yml deliberately does NOT extend this. Its server runs from the repo source in
# /app and shares the daemon's real ~/.deepsteve so the tests read the token it generated; these
# three run an *installed* build out of /root/.deepsteve and seed a token into it instead.
# Different auth story, not one story with an override — and test/unit/integration-scratch-guard
# holds both to the same scratch-mount rule regardless of how they get there.
#
# `extends` copies neither `depends_on` nor top-level keys, so each suite restates its
# `depends_on` and its `volumes:` block. Everything else it inherits.
#
# A project `name:` even though nothing runs this file: an accidental `docker compose -f` here
# must not land in a sibling's project (#616), and it keeps this file in
# test/unit/compose-projects.test.js's glob like any other.
name: deepsteve-base

services:
  server:
    build:
      context: ..
      # dockerfile: supplied by the extending suite — that choice IS the suite.
    # No host port publish (#588/#616): the test container reaches us as server:3000 on the
    # compose network and the healthcheck runs in-container, so nothing needs one — and
    # 3000:3000 collides with the developer's own daemon, which made these unrunnable locally.
    environment:
      - PORT=3000
      - DEEPSTEVE_BIND=0.0.0.0
      # Auth (#536): the test container reaches us as http://server:3000, so allowlist that host.
      - DEEPSTEVE_ALLOW_HOST=server
      # Test mode (#562): required so the test helpers accept this server — they refuse any
      # target whose /api/version lacks testMode:true, with no bypass. Harmless on a release
      # that predates #562 (it just ignores the variable), because that release's own helpers —
      # the ones the public suite runs, per #588 — predate the requirement too.
      - DEEPSTEVE_TEST_MODE=1
    volumes:
      # Token-only volume (#539): the app lives IN /root/.deepsteve for all three of these
      # (unlike docker-compose.yml, where it is /app), so sharing that whole directory would
      # risk running stale installed code out of a persisted volume. Share just the token, via
      # a neutral path, regenerated every start.
      - ds_token:/auth
      # Scratch cwds the test container creates and this one must be able to spawn into (#637).
      # These are two containers: without this mount the directory exists only in `test`, and
      # since #632 the server REFUSES a spawn into a cwd it cannot see, so every test that
      # needs a real directory fails with cwd-missing.
      - ds_scratch:/scratch
    # Seed a fresh random token before the server starts: loadOrCreateToken() (security.js)
    # reuses a non-empty ~/.deepsteve/auth-token verbatim, so this is the token the server
    # serves. The healthcheck only passes after listen, so the test container always sees the
    # final token.
    command:
      - sh
      - -c
      - |
        set -e
        node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))' > /auth/token
        install -m 600 /auth/token /root/.deepsteve/auth-token
        exec node server.js
    healthcheck:
      # GET / (static index.html) is mounted above security.authGate in every build, so it needs
      # no token and no version-specific endpoint — which is what lets the public suite front an
      # arbitrarily old release with this same healthcheck. Do NOT switch to /api/version: that
      # is auth-gated and the token is not in this environment.
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:3000/"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  test:
    build:
      context: ..
      dockerfile: test/Dockerfile
    environment:
      - DEEPSTEVE_URL=http://server:3000
      # Where test/helpers/server-dir.js makes scratch cwds, so they exist for the server too
      # (#637). Unset, that helper throws rather than hand back a path only this container has.
      - DEEPSTEVE_TEST_SCRATCH=/scratch
    volumes:
      - ds_token:/auth       # read the server-seeded auth token (#539)
      - ds_scratch:/scratch  # the same mount the server has, see above (#637)
    # Copy the token where the test helper reads it (~/.deepsteve/auth-token), then run the
    # suite: one `node --test` process per file, one at a time. See test/run-integration.sh for
    # why --test-concurrency=1 isn't enough, and why it can no longer skip a file at all.
    command:
      - sh
      - -c
      - |
        set -e
        cp /auth/token /root/.deepsteve/auth-token
        exec sh test/run-integration.sh
