# Runs the test suite against the LAST PUBLISHED RELEASE (Dockerfile.public installs via
# deepsteve.com/install.sh, which 302s to releases/latest/download/install.sh).
#
# This suite is only meaningful when the working tree IS the release under test (#588).
# .github/workflows/install-integration-tests.yml guarantees that by checking out the tag it
# resolved before running this file. A local run from main tests main's tests against an older
# server — the exact skew #588 removed — so check the release out first:
#
#   git checkout $(gh api repos/deepsteve/deepsteve/releases/latest --jq .tag_name)
#   npm run test:docker:public
#
# Explicit project name (#588): compose otherwise derives it from this file's parent directory
# — "test" — which is the SAME project as docker-compose.yml and docker-compose.install.yml,
# whose services are also named server/test. A `down -v` would then reach into a concurrently
# running source suite and delete its volumes.
name: deepsteve-public

services:
  server:
    build:
      context: ..
      dockerfile: test/Dockerfile.public
    # No host port publish (#588): the test container reaches us as server:3000 on the compose
    # network and the healthcheck runs in-container, so nothing needs one — and 3000:3000
    # collides with the developer's own daemon, which made this suite unrunnable locally.
    environment:
      - PORT=3000
      - DEEPSTEVE_BIND=0.0.0.0
      # Auth (#536): the test container reaches us as http://server:3000, so allowlist that host.
      - DEEPSTEVE_ALLOW_HOST=server
      # Test mode (#562): required so the test helpers accept this server — they refuse any target
      # whose /api/version lacks testMode:true, with no bypass. Harmless on a release that predates
      # #562 (it just ignores the variable), because that release's own helpers — the ones this
      # suite runs, per #588 — predate the requirement too.
      - DEEPSTEVE_TEST_MODE=1
    volumes:
      # Token-only volume (#539): the app lives IN /root/.deepsteve here (unlike docker-compose.yml,
      # where it's in /app), so sharing that whole dir would risk running stale installed code from
      # a persisted volume. Instead share just the token via a neutral path; regenerated every start.
      - ds_token:/auth
    # Seed a fresh random token before the server starts: loadOrCreateToken() (security.js) reuses
    # a non-empty ~/.deepsteve/auth-token verbatim, so this is the token the server serves. The
    # healthcheck only passes after listen, so the test container always sees the final token.
    command:
      - sh
      - -c
      - |
        set -e
        node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))' > /auth/token
        install -m 600 /auth/token /root/.deepsteve/auth-token
        exec node server.js
    healthcheck:
      # GET / (static index.html) is served unauthenticated in every build, so it needs no token
      # and no version-specific endpoint. Do NOT switch to /api/version here: it's auth-gated and
      # the token isn't seeded into the healthcheck's environment.
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:3000/"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  test:
    build:
      context: ..
      dockerfile: test/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      - DEEPSTEVE_URL=http://server:3000
    volumes:
      - ds_token:/auth   # read the server-seeded auth token (#539)
    # Copy the token where the test helper reads it (~/.deepsteve/auth-token), then run files
    # serially (one process each). See test/run-integration.sh for why --test-concurrency=1
    # isn't enough.
    #
    # NO skip pattern any more. tmux-engine was skipped because the public image had no tmux;
    # it now must (Dockerfile.public), since install.sh refuses to install on Linux without
    # it — so the skip's only justification is gone and this suite covers the DEFAULT engine
    # against the released build. Verified against v0.22.0: tmux-engine.test.js 10/10.
    command:
      - sh
      - -c
      - |
        set -e
        cp /auth/token /root/.deepsteve/auth-token
        exec sh test/run-integration.sh

volumes:
  ds_token:
