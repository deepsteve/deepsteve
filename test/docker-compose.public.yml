# Runs the test suite against the LAST PUBLISHED RELEASE (Dockerfile.public installs via
# deepsteve.com/install.sh, which 302s to releases/latest/download/install.sh).
#
# Everything but the image under test comes from docker-compose.base.yml — read that file for
# why there is no host port, how the auth token is seeded, and what /scratch is for.
#
# This suite is only meaningful when the working tree IS the release under test (#588).
# .github/workflows/install-integration-tests.yml guarantees that by checking out the tag it
# resolved before running this file. A local run from main tests main's tests against an older
# server — the exact skew #588 removed — so check the release out first:
#
#   git checkout $(gh api repos/deepsteve/deepsteve/releases/latest --jq .tag_name)
#   npm run test:docker:public
#
# The corollary is that a fix HERE cannot reach the daily cron until a release carries it: the
# workflow builds this file from the tag, not from main. That is how v0.23.0 shipped a suite
# that fails on its own #632 tests — the release was cut hours before #637 landed the scratch
# mount those tests need. Nothing on main can un-break a tagged tree; the job self-heals on the
# next release, which is the design working, not a gap to paper over.
#
# Explicit project name (#588): compose otherwise derives it from this file's parent directory
# — "test" — which is the SAME project as its siblings, whose services are also named
# server/test. A `down -v` would then reach into a concurrently running sibling suite and delete
# its volumes.
name: deepsteve-public

services:
  server:
    extends:
      file: docker-compose.base.yml
      service: server
    build:
      dockerfile: test/Dockerfile.public

  test:
    extends:
      file: docker-compose.base.yml
      service: test
    # `extends` never copies depends_on, so this cannot live in the base.
    depends_on:
      server:
        condition: service_healthy

# Nor does it copy top-level keys, so the volumes the base mounts are declared here.
volumes:
  ds_token:
  ds_scratch:
